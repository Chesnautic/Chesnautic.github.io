<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Connecting TikTok · Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --pink: #FF1F5A; --ink: #0A0A0A; --paper: #F4F1EC; --dim: rgba(244,241,236,.6); }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: "Archivo", system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .box { max-width: 420px; text-align: center; display: grid; gap: 14px; }
  h1 { font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 40px; }
  p { color: var(--dim); }
  a { color: var(--pink); }
  .err { color: #ff8aa5; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="box">
  <h1>Content Studio</h1>
  <p id="msg">Connecting your TikTok account…</p>
</div>
<script>
(async () => {
  const msg = document.getElementById("msg");
  const fail = (t) => { msg.className = "err"; msg.innerHTML = ""; msg.append(t + " "); const a = document.createElement("a"); a.href = "./"; a.textContent = "Back to Content Studio"; msg.append(a); };
  const q = new URLSearchParams(location.search);
  if (q.get("error")) return fail("TikTok login was cancelled (" + (q.get("error_description") || q.get("error")) + ").");
  let expected = null; try { expected = sessionStorage.getItem("cs_state"); } catch (e) {}
  if (!q.get("code")) return fail("TikTok didn't send a login code.");
  if (!expected || q.get("state") !== expected) return fail("This login link doesn't match the one we started. Try connecting again.");
  try {
    const r = await fetch(STUDIO.api + "/api/callback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: q.get("code") }) });
    const j = await r.json();
    if (!r.ok) return fail(j.error || "Login failed.");
    try {
      let list = []; try { list = JSON.parse(localStorage.getItem("cs_accounts") || "[]"); } catch (e) {}
      list = list.filter((a) => a.open_id !== j.open_id && a.open_id !== "legacy");
      list.push({ open_id: j.open_id, session: j.session, user: j.user });
      localStorage.setItem("cs_accounts", JSON.stringify(list));
      localStorage.setItem("cs_active", j.open_id);
      sessionStorage.removeItem("cs_state");
    } catch (e) {}
    location.replace("./");
  } catch (e) { fail("Couldn't reach the Content Studio server."); }
})();
</script>
</body>
</html>
